<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H&amp;M Locksmith &amp; Building Services — London</title>
  <meta name="description" content="H&M Locksmith & Building Services — 24/7 locksmith, security and building services across London. New website coming soon.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/chatbot.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #111; color: #f4f4f4; text-align: center; padding: 32px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .holding { max-width: 520px; }
    .holding img { width: 92px; height: 92px; margin: 0 auto 26px; display: block; }
    .holding h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; margin: 0 0 10px; }
    .holding p { color: #b8b8ba; line-height: 1.6; margin: 0 0 24px; }
    .holding .phones { display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: center; }
    .holding .phones a { color: #fff; font-weight: 700; text-decoration: none; }
    .holding .phones small { display: block; color: #8a8a8c; font-weight: 500; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
  </style>
</head>
<body>

  <!-- Hidden Netlify form so chatbot lead submissions are captured -->
  <form name="chatbot-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="service"><input type="text" name="name"><input type="tel" name="phone">
    <input type="text" name="area"><input type="text" name="urgency"><textarea name="details"></textarea>
    <textarea name="transcript"></textarea><input name="bot-field">
  </form>

  <main class="holding">
    <img src="/assets/images/logo-badge.svg" alt="H&M Locksmith & Building Services">
    <h1>Our new website is on its way</h1>
    <p>H&amp;M Locksmith &amp; Building Services — 24/7 locksmith, security and building work across London. In the meantime, call us or chat with Harry below.</p>
    <div class="phones">
      <a href="tel:+442031051145"><small>Locksmith &amp; Security</small>0203 105 1145</a>
      <a href="tel:+442033024022"><small>Domestic &amp; Building</small>0203 302 4022</a>
    </div>
  </main>

  <script src="/assets/js/chatbot.js" defer></script>
</body>
</html>
